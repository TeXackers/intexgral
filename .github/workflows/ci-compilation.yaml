name: Continuous Integration

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compile LaTeX docs
        uses: islandoftex/texlive-action@v2
        with:
          run: |
            l3build doc -q intexgral-en
            l3build doc -q intexgral-fr

      - name: Upload compiled PDFs
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pdfs
          path: |
            *.pdf