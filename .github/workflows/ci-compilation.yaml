name: Continuous Integration

on:
  push:
    branches: [ master, dev ]
    paths-ignore: [ '*.md', '*.lua', '*.py', '*.txt', '*.yaml', '*.txt']
  pull_request:
    branches: [ master, dev ]

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          package_file: .github/tl_packages.txt
        
      - name: Compile documentation
        run: |
            l3build doc -q intexgral-en
            l3build doc -q intexgral-fr

      - name: Upload compiled PDFs
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pdfs
          path: |
            *.pdf