name: Continuous Integration

on:
  push:
    branches: [ master, dev ]
    paths-ignore: [ '*.md', '*.lua', '*.py', '*.txt', '*.yaml' ]
  pull_request:
    branches: [ master, dev ]

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          package_file: .github/tl_packages.txt

      - name: Install system dependencies (poppler-utils)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Compile documentation
        run: |
            l3build doc -q intexgral-en
            l3build doc -q intexgral-fr

      - name: Run tests
        run: |
            l3build check
            ppmcheckpdf check

      - name: Debug generated PNG files
        if: always()
        run: ls -la build/test/

      - name: Upload compiled PDFs
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pdfs
          path: |
            *.pdf